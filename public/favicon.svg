<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="imtxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a0e17" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#imtxGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <g transform="translate(10, 10)">
    <!-- Central Tech Diamond & Node Structure -->
    <path d="M22 4 L38 13 L38 31 L22 40 L6 31 L6 13 Z" fill="none" stroke="url(#imtxGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M22 4 L22 22 L38 31" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <path d="M22 22 L6 31" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <!-- Core Center Pulsing Dot -->
    <circle cx="22" cy="22" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <!-- Outer connection points -->
    <circle cx="22" cy="4" r="1.5" fill="#06b6d4" />
    <circle cx="38" cy="13" r="1.5" fill="#3b82f6" />
    <circle cx="38" cy="31" r="1.5" fill="#8b5cf6" />
    <circle cx="22" cy="40" r="1.5" fill="#8b5cf6" />
    <circle cx="6" cy="31" r="1.5" fill="#3b82f6" />
    <circle cx="6" cy="13" r="1.5" fill="#06b6d4" />
  </g>
</svg>
