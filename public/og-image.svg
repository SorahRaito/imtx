<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1c2840" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Orbs in Background -->
  <circle cx="250" cy="200" r="180" fill="#06b6d4" opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="950" cy="450" r="220" fill="#8b5cf6" opacity="0.1" filter="url(#ogGlow)" />

  <!-- Logo Mark -->
  <g transform="translate(120, 220)">
    <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linejoin="round" />
    <path d="M60,10 L60,60 L105,85" fill="none" stroke="#06b6d4" stroke-width="5" />
    <path d="M60,60 L15,85" fill="none" stroke="#8b5cf6" stroke-width="5" />
    <circle cx="60" cy="60" r="9" fill="#38bdf8" />
  </g>

  <!-- Content -->
  <text x="260" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="url(#textGrad)" letter-spacing="4">IMTX</text>
  <text x="260" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#e2e8f0" letter-spacing="0.5">Next Generation Technology Platform</text>
  <text x="260" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">Ultra-low latency, decentralized infrastructure &amp; enterprise-grade security.</text>
  
  <!-- Domain Badge -->
  <rect x="260" y="440" width="180" height="42" rx="21" fill="#141c2d" stroke="#06b6d4" stroke-width="1.5" />
  <text x="350" y="467" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#38bdf8" text-anchor="middle">imtx.win</text>
</svg>
